<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AEGIS Citizen Offline SOS</title>
  <link rel="manifest" href="manifest-citizen.json">
  <link rel="icon" type="image/png" href="citizen-icon.png">
  <link rel="apple-touch-icon" href="citizen-icon.png">
  <meta name="theme-color" content="#ef4444">

  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Offline Styles -->
  <link rel="stylesheet" href="offline-styles.css">
  
  <style>
    html, body {
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      background: linear-gradient(to bottom, rgba(3, 7, 18, 0.1), rgba(3, 7, 18, 0.25)), url('citizen.png') no-repeat center center fixed !important;
      background-size: cover !important;
      image-rendering: -webkit-optimize-contrast;
    }
    .container {
      padding: 0.75rem 1rem 2.5rem 1rem;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: rgba(15, 23, 42, 0.94);
      padding: 0.85rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border-radius: 16px;
    }
    .form-group {
      margin-bottom: 0.6rem;
    }
    .form-control, .form-select {
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
    }
    .btn-sos {
      padding: 0.85rem;
      font-size: 0.92rem;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-badge">
      <div class="brand-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div>
        <div class="brand-title" id="lbl-badge-title">AEGIS Citizen</div>
        <div style="font-size:0.62rem; color:#94a3b8; font-weight:700;" id="lbl-badge-sub">Offline Emergency SOS</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <select id="lang-select" onchange="changeLanguage()" style="background:rgba(30,41,59,0.9); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; font-weight:800; font-size:0.75rem; border-radius:10px; padding:4px 8px; outline:none; cursor:pointer;">
        <option value="en">🌐 English</option>
        <option value="hi">🌐 हिंदी</option>
        <option value="as">🌐 অসমীয়া</option>
      </select>
      <div class="offline-pill">
        <i class="fa-solid fa-wifi-slash"></i> <span id="lbl-mode">Offline Mode</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div style="font-size:0.85rem; font-weight:800; color:#38bdf8; margin-bottom:1rem; display:flex; align-items:center; gap:0.4rem;">
        <i class="fa-solid fa-tower-cell"></i> <span id="lbl-dispatch-title">2G Offline SMS Dispatch</span>
      </div>

      <!-- District / Location Selection -->
      <div class="form-group">
        <label class="form-label" id="lbl-select-district">Select Your District in Assam</label>
        <select id="district-select" class="form-select" onchange="onDistrictChange()">
          <option value="Golaghat" data-lat="26.5181" data-lng="93.9612" data-phone="+91 8143893783">Golaghat District (Ward 4)</option>
          <option value="Guwahati" data-lat="26.1445" data-lng="91.7362" data-phone="+91 8309289388">Kamrup Metro / Guwahati</option>
          <option value="Silchar" data-lat="24.8333" data-lng="92.7789" data-phone="+91 94350 10703">Cachar / Silchar</option>
          <option value="Dibrugarh" data-lat="27.4728" data-lng="94.9120" data-phone="+91 94350 10704">Dibrugarh District</option>
          <option value="Lakhimpur" data-lat="27.2361" data-lng="94.1035" data-phone="+91 94350 10705">North Lakhimpur</option>
          <option value="Jorhat" data-lat="26.7509" data-lng="94.2037" data-phone="+91 94350 10706">Jorhat District</option>
        </select>
        <div id="gps-coords-display" style="font-size:0.68rem; color:#38bdf8; margin-top:0.35rem; font-weight:700;">
          <i class="fa-solid fa-location-crosshairs"></i> GPS Locked: Golaghat, Assam (26.5181° N, 93.9612° E)
        </div>
      </div>

      <!-- Citizen Phone Number -->
      <div class="form-group">
        <label class="form-label" id="lbl-phone">Your Mobile Phone Number (For Rescue Callback)</label>
        <div style="display:flex; align-items:center;">
          <span style="background:rgba(30, 41, 59, 0.95); border:1px solid rgba(255,255,255,0.15); border-right:none; color:#38bdf8; font-weight:800; padding:0.68rem 0.85rem; border-top-left-radius:12px; border-bottom-left-radius:12px; font-size:0.88rem;">+91</span>
          <input type="tel" id="citizen-phone" class="form-control" style="border-top-left-radius:0; border-bottom-left-radius:0;" value="" placeholder="Enter 10-digit mobile number" maxlength="10">
        </div>
      </div>

      <!-- Headcount Pickers -->
      <div class="counter-grid form-group">
        <div class="counter-box">
          <label class="form-label" id="lbl-trapped">Total Trapped</label>
          <div class="counter-btn-group">
            <button class="btn-counter" onclick="adjustCount('people', -1)">-</button>
            <span id="count-people" class="counter-val">5</span>
            <button class="btn-counter" onclick="adjustCount('people', 1)">+</button>
          </div>
        </div>
        <div class="counter-box">
          <label class="form-label" id="lbl-children">Children / Elderly</label>
          <div class="counter-btn-group">
            <button class="btn-counter" onclick="adjustCount('children', -1)">-</button>
            <span id="count-children" class="counter-val">2</span>
            <button class="btn-counter" onclick="adjustCount('children', 1)">+</button>
          </div>
        </div>
      </div>

      <!-- Emergency Hazard Type Dropdown -->
      <div class="form-group">
        <label class="form-label" id="lbl-hazard">Emergency Hazard Situation</label>
        <select id="hazard-select" class="form-select">
          <option id="hz-roof" value="ROOF_SUBMERGED">🏠 Trapped on Submerged Roof</option>
          <option id="hz-water" value="HOUSE_WATERLOGGED">🌊 Water inside House (3+ feet)</option>
          <option id="hz-medical" value="MEDICAL_URGENCY">🚑 Medical Emergency / Pregnant</option>
          <option id="hz-food" value="FOOD_WATER_SHORTAGE">📦 Food & Drinking Water Shortage</option>
        </select>
      </div>

      <!-- Target Rescue Officer Hotline Number -->
      <div class="form-group">
        <label class="form-label" id="lbl-hotline">Target Rescue Unit Hotline</label>
        <input type="tel" id="rescue-phone" class="form-control" value="+91 8143893783" placeholder="Enter rescue squad hotline number">
        <div style="font-size:0.68rem; color:#94a3b8; margin-top:0.35rem;">
          <i class="fa-solid fa-circle-info" style="color:#38bdf8;"></i> <span id="lbl-auto-info">Auto-assigned to nearest district unit.</span>
        </div>
      </div>

      <!-- Send Offline SOS Button -->
      <button class="btn-sos" onclick="sendOfflineSms()">
        <i class="fa-solid fa-paper-plane"></i> <span id="btn-send-sms">SEND OFFLINE EMERGENCY SMS</span>
      </button>
    </div>
  </div>

  <script>
    let counts = { people: 5, children: 2 };

    const translations = {
      en: {
        badgeTitle: "AEGIS Citizen",
        badgeSub: "Offline Emergency SOS",
        modePill: "Offline Mode",
        dispatchTitle: "2G Offline SMS Dispatch",
        selectDistrict: "Select Your District in Assam",
        phoneLabel: "Your Mobile Phone Number (For Rescue Callback)",
        phonePlaceholder: "Enter 10-digit mobile number",
        trappedLabel: "Total Trapped",
        childrenLabel: "Children / Elderly",
        hazardLabel: "Emergency Hazard Situation",
        hzRoof: "🏠 Trapped on Submerged Roof",
        hzWater: "🌊 Water inside House (3+ feet)",
        hzMedical: "🚑 Medical Emergency / Pregnant",
        hzFood: "📦 Food & Drinking Water Shortage",
        hotlineLabel: "Target Rescue Unit Hotline",
        autoInfo: "Auto-assigned to nearest district unit.",
        sendBtn: "SEND OFFLINE EMERGENCY SMS",
        gpsLocked: "GPS Locked"
      },
      hi: {
        badgeTitle: "AEGIS नागरिक",
        badgeSub: "ऑफलाइन आपातकालीन SOS",
        modePill: "ऑफलाइन मोड",
        dispatchTitle: "2G ऑफलाइन SMS सेवा",
        selectDistrict: "असम में अपना जिला चुनें",
        phoneLabel: "आपका मोबाइल नंबर (बचाव कॉल के लिए)",
        phonePlaceholder: "10-अंकों का मोबाइल नंबर दर्ज करें",
        trappedLabel: "कुल फंसे हुए लोग",
        childrenLabel: "बच्चे / बुजुर्ग",
        hazardLabel: "आपातकालीन स्थिति",
        hzRoof: "🏠 डूबी हुई छत पर फंसे हुए हैं",
        hzWater: "🌊 घर के अंदर पानी (3+ फीट)",
        hzMedical: "🚑 चिकित्सा आपातकाल / गर्भवती",
        hzFood: "📦 भोजन और पीने के पानी की कमी",
        hotlineLabel: "लक्ष्य बचाव दल हॉटलाइन",
        autoInfo: "निकटतम जिला दल को स्वतः आवंटित।",
        sendBtn: "ऑफलाइन आपातकालीन SMS भेजें",
        gpsLocked: "जीपीएस लॉक"
      },
      as: {
        badgeTitle: "AEGIS নাগৰিক",
        badgeSub: "অফলাইন জৰুৰীকালীন SOS",
        modePill: "অফলাইন ম'ড",
        dispatchTitle: "2G অফলাইন SMS সেৱা",
        selectDistrict: "অসমৰ আপোনাৰ জিলা বাছক",
        phoneLabel: "আপোনাৰ মোবাইল নম্বৰ (উদ্ধাৰ কলৰ বাবে)",
        phonePlaceholder: "১০-সংখ্যাৰ মোবাইল নম্বৰ প্ৰৱিষ্ট কৰক",
        trappedLabel: "মুঠ আৱদ্ধ লোক",
        childrenLabel: "শিশু / বয়োবৃদ্ধ",
        hazardLabel: "জৰুৰীকালীন বিপদজনক পৰিস্থিতি",
        hzRoof: "🏠 জলমগ্ন চালত আৱদ্ধ হৈ আছে",
        hzWater: "🌊 ঘৰৰ ভিতৰত পানী (৩+ ফুট)",
        hzMedical: "🚑 চিকিৎসা জৰুৰীকালীন / গৰ্ভৱতী",
        hzFood: "📦 খাদ্য আৰু খোৱাপানীৰ অভাৱ",
        hotlineLabel: "লক্ষ্য উদ্ধাৰকাৰী দলৰ হটলাইন",
        autoInfo: "নিকটতম জিলা উদ্ধাৰকাৰী দললৈ স্বয়ংক্ৰিয়ভাৱে আবণ্টন।",
        sendBtn: "অফলাইন জৰুৰীকালীন SMS প্ৰেৰণ কৰক",
        gpsLocked: "GPS লক কৰা হৈছে"
      }
    };

    function changeLanguage() {
      const lang = document.getElementById('lang-select').value;
      const t = translations[lang] || translations.en;

      document.getElementById('lbl-badge-title').innerText = t.badgeTitle;
      document.getElementById('lbl-badge-sub').innerText = t.badgeSub;
      document.getElementById('lbl-mode').innerText = t.modePill;
      document.getElementById('lbl-dispatch-title').innerText = t.dispatchTitle;
      document.getElementById('lbl-select-district').innerText = t.selectDistrict;
      document.getElementById('lbl-phone').innerText = t.phoneLabel;
      document.getElementById('citizen-phone').placeholder = t.phonePlaceholder;
      document.getElementById('lbl-trapped').innerText = t.trappedLabel;
      document.getElementById('lbl-children').innerText = t.childrenLabel;
      document.getElementById('lbl-hazard').innerText = t.hazardLabel;
      document.getElementById('hz-roof').innerText = t.hzRoof;
      document.getElementById('hz-water').innerText = t.hzWater;
      document.getElementById('hz-medical').innerText = t.hzMedical;
      document.getElementById('hz-food').innerText = t.hzFood;
      document.getElementById('lbl-hotline').innerText = t.hotlineLabel;
      document.getElementById('lbl-auto-info').innerText = t.autoInfo;
      document.getElementById('btn-send-sms').innerText = t.sendBtn;

      onDistrictChange();
    }

    function adjustCount(type, delta) {
      counts[type] = Math.max(0, counts[type] + delta);
      document.getElementById(`count-${type}`).innerText = counts[type];
    }

    function onDistrictChange() {
      const select = document.getElementById('district-select');
      const selectedOption = select.options[select.selectedIndex];
      const targetPhone = selectedOption.getAttribute('data-phone');
      const lat = selectedOption.getAttribute('data-lat');
      const lng = selectedOption.getAttribute('data-lng');
      const distName = selectedOption.value;

      const lang = document.getElementById('lang-select').value;
      const t = translations[lang] || translations.en;

      if (targetPhone) {
        document.getElementById('rescue-phone').value = targetPhone;
      }
      document.getElementById('gps-coords-display').innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> ${t.gpsLocked}: ${distName}, Assam (${lat}° N, ${lng}° E)`;
    }

    function sendOfflineSms() {
      const districtSelect = document.getElementById('district-select');
      const selectedOpt = districtSelect.options[districtSelect.selectedIndex];
      
      const district = selectedOpt.value;
      const lat = selectedOpt.getAttribute('data-lat');
      const lng = selectedOpt.getAttribute('data-lng');
      
      let rawPhone = document.getElementById('citizen-phone').value.replace(/\D/g, '');
      if (!rawPhone) rawPhone = '9876543210';
      const citizenPhone = `+91${rawPhone}`;
      const rescuePhone = document.getElementById('rescue-phone').value.trim();
      const hazard = document.getElementById('hazard-select').value;

      // English Hazard dictionary for SMS output (ensures 100% English SMS output regardless of UI language)
      const englishHazards = {
        'ROOF_SUBMERGED': '🏠 Trapped on Submerged Roof',
        'HOUSE_WATERLOGGED': '🌊 Water inside House (3+ feet)',
        'MEDICAL_URGENCY': '🚑 Medical Emergency / Pregnant',
        'FOOD_WATER_SHORTAGE': '📦 Food & Drinking Water Shortage'
      };
      const hazardTextEnglish = englishHazards[hazard] || '🏠 Trapped on Submerged Roof';

      // Construct clean 3-part message formatted with dividers so Android SMS apps do not truncate
      const part1 = `🚨 AEGIS FLOOD EMERGENCY SOS\n📍 Location: ${district} District (${lat}, ${lng})\n👥 Trapped: ${counts.people} People (${counts.children} Children)\n⚠️ Hazard: ${hazardTextEnglish}\n📞 Contact: ${citizenPhone}`;
      
      const part2 = `📋 PASTE THIS CODE IN AEGIS RESCUE APP:`;
      
      const part3 = `aegis.sos/AEGIS#SOS#91${rawPhone}#${lat},${lng}#${district}#${counts.people}P#${counts.children}C#${hazard}`;

      const fullSmsBody = `${part1}\n───────────────\n${part2}\n───────────────\n${part3}`;

      // Clean phone number for sms: URI scheme
      const cleanTargetNumber = rescuePhone.replace(/[^\d+]/g, '');

      // Open native SMS messaging app
      const smsUri = `sms:${cleanTargetNumber}?body=${encodeURIComponent(fullSmsBody)}`;
      window.location.href = smsUri;
    }

    // Automatically trigger native Location Permission Prompt on launch for demo
    window.addEventListener('DOMContentLoaded', () => {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { console.log('Location permission granted'); },
          (err) => { console.log('Location fallback active'); },
          { timeout: 5000 }
        );
      }
    });

    // Register Service Worker for 100% Offline PWA Mode with auto-update
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update();
      }).catch(err => console.log('SW Reg Error:', err));
    }
  </script>
</body>
</html>
