<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AEGIS Rescue Team Offline Command</title>
  <link rel="manifest" href="manifest-rescue.json">
  <meta name="theme-color" content="#10b981">

  <!-- Google Fonts, Leaflet & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Offline Styles -->
  <link rel="stylesheet" href="offline-styles.css">
  
  <style>
    body {
      background: linear-gradient(to bottom, rgba(3, 7, 18, 0.82), rgba(3, 7, 18, 0.94)), url('rescue.jpg') no-repeat center center fixed !important;
      background-size: cover !important;
    }
    .victim-card {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-critical {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-badge">
      <div class="brand-icon rescue-icon"><i class="fa-solid fa-ship"></i></div>
      <div>
        <div class="brand-title">AEGIS Rescue Command</div>
        <div style="font-size:0.62rem; color:#94a3b8; font-weight:700;">Offline Tactical Unit</div>
      </div>
    </div>
    <div class="offline-pill" style="background:rgba(16,185,129,0.15); border-color:rgba(16,185,129,0.4); color:#6ee7b7;">
      <i class="fa-solid fa-satellite-dish"></i> Signal Active
    </div>
  </header>

  <div class="container">

    <!-- Leaflet Mobile Map -->
    <div id="map"></div>

    <!-- Alert Status Box -->
    <div id="victim-container" class="card victim-card" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
        <span class="status-badge badge-critical">
          <i class="fa-solid fa-triangle-exclamation"></i> CRITICAL SOS ALERT
        </span>
        <span id="dist-eta" style="font-size:0.75rem; font-weight:800; color:#38bdf8;">
          <i class="fa-solid fa-route"></i> 2.4 km (11 mins)
        </span>
      </div>

      <div style="font-size:1.1rem; font-weight:800; color:#fff; margin-bottom:0.4rem;" id="victim-location">
        Golaghat District (Ward 4)
      </div>

      <!-- Victims Headcount & Hazard Badge -->
      <div style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.85rem;">
        <span style="background:rgba(255,255,255,0.08); padding:4px 10px; border-radius:8px; font-size:0.75rem; font-weight:700; color:#cbd5e1;">
          <i class="fa-solid fa-users" style="color:#ef4444;"></i> Trapped: <strong id="v-people" style="color:#fff;">5 People</strong>
        </span>
        <span style="background:rgba(255,255,255,0.08); padding:4px 10px; border-radius:8px; font-size:0.75rem; font-weight:700; color:#cbd5e1;">
          <i class="fa-solid fa-child" style="color:#f59e0b;"></i> Children: <strong id="v-children" style="color:#fff;">2</strong>
        </span>
        <span style="background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.3); padding:4px 10px; border-radius:8px; font-size:0.75rem; font-weight:700; color:#38bdf8;" id="v-hazard">
          🏠 Trapped on Roof
        </span>
      </div>

      <!-- Citizen Contact & Action Buttons -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.75rem;">
        <a id="btn-call" href="tel:+919876543210" class="btn-action" style="background:linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); text-decoration:none;">
          <i class="fa-solid fa-phone"></i> CALL VICTIM
        </a>
        <button id="btn-deploy" class="btn-action" onclick="toggleDeploy()">
          <i class="fa-solid fa-paper-plane"></i> DEPLOY BOAT
        </button>
      </div>
    </div>

    <!-- Manual Packet Importer (For Presentation Testing) -->
    <div class="card">
      <div class="form-label"><i class="fa-solid fa-terminal" style="color:#38bdf8;"></i> Parse/Paste SOS Payload Code</div>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="manual-payload-input" class="form-control" placeholder="AEGIS#SOS#9876543210#26.5181,93.9612#Golaghat#5P#2C#ROOF_SUBMERGED">
        <button onclick="parseManualInput()" style="background:#38bdf8; border:none; color:#030712; font-weight:800; padding:0 1rem; border-radius:12px; cursor:pointer;">
          DECODE
        </button>
      </div>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, victimMarker, boatMarker, routeLine;
    let isDeployed = false;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      checkUrlQueryData();
    });

    function initMap() {
      // Default center in Golaghat, Assam
      map = L.map('map').setView([26.5181, 93.9612], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
    }

    function checkUrlQueryData() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawData = urlParams.get('data');
      if (rawData) {
        document.getElementById('manual-payload-input').value = rawData;
        processAegisPayload(rawData);
      } else {
        // Default Demo Payload for presentation
        const defaultPayload = "AEGIS#SOS#+91 98765 43210#26.5181,93.9612#Golaghat#5P#2C#ROOF_SUBMERGED";
        processAegisPayload(defaultPayload);
      }
    }

    function parseManualInput() {
      const val = document.getElementById('manual-payload-input').value.trim();
      if (val) processAegisPayload(val);
    }

    function processAegisPayload(payloadStr) {
      // Payload format: AEGIS#SOS#PHONE#LAT,LNG#DISTRICT#PEOPLE#CHILDREN#HAZARD
      const parts = payloadStr.split('#');
      if (parts.length < 8) return;

      const citizenPhone = parts[2];
      const coords = parts[3].split(',');
      const lat = parseFloat(coords[0]);
      const lng = parseFloat(coords[1]);
      const district = parts[4];
      const people = parts[5].replace('P','');
      const children = parts[6].replace('C','');
      const hazardCode = parts[7];

      // Update UI Card
      document.getElementById('victim-container').style.display = 'block';
      document.getElementById('victim-location').innerText = `${district} District (Assam)`;
      document.getElementById('v-people').innerText = `${people} People`;
      document.getElementById('v-children').innerText = children;
      document.getElementById('btn-call').href = `tel:${citizenPhone}`;

      // Hazard badge map
      const hazardMap = {
        'ROOF_SUBMERGED': '🏠 Trapped on Roof',
        'HOUSE_WATERLOGGED': '🌊 House Submerged (3+ ft)',
        'MEDICAL_URGENCY': '🚑 Medical Emergency',
        'FOOD_WATER_SHORTAGE': '📦 Food & Water Shortage'
      };
      document.getElementById('v-hazard').innerText = hazardMap[hazardCode] || '🚨 Emergency SOS';

      // Boat base camp coordinates (approx 2.4km away in Golaghat)
      const boatLat = lat + 0.015;
      const boatLng = lng - 0.012;

      // Clear existing markers
      if (victimMarker) map.removeLayer(victimMarker);
      if (boatMarker) map.removeLayer(boatMarker);
      if (routeLine) map.removeLayer(routeLine);

      // Custom Red Victim Pin Icon
      const redIcon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#ef4444; width:28px; height:28px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; box-shadow:0 0 15px #ef4444;"><i class="fa-solid fa-person-shelter"></i></div>`
      });

      // Custom Green Speedboat Icon
      const greenIcon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#10b981; width:30px; height:30px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; box-shadow:0 0 15px #10b981;"><i class="fa-solid fa-ship"></i></div>`
      });

      victimMarker = L.marker([lat, lng], { icon: redIcon }).addTo(map).bindPopup(`<b>Victim SOS Location</b><br>${citizenPhone}`);
      boatMarker = L.marker([boatLat, boatLng], { icon: greenIcon }).addTo(map).bindPopup(`<b>NDRF Speedboat Base SD-04</b>`);

      // Draw dashed navigation route line
      routeLine = L.polyline([[boatLat, boatLng], [lat, lng]], {
        color: '#10b981',
        weight: 4,
        dashArray: '8, 8'
      }).addTo(map);

      // Auto-fit Leaflet bounds to show both pins!
      const bounds = L.latLngBounds([[lat, lng], [boatLat, boatLng]]);
      map.fitBounds(bounds, { padding: [40, 40] });

      // Play Sound Siren
      playEmergencySiren();
    }

    function toggleDeploy() {
      const btn = document.getElementById('btn-deploy');
      if (!isDeployed) {
        btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> BOAT DISPATCHED`;
        btn.style.background = 'linear-gradient(135deg, #059669 0%, #047857 100%)';
        isDeployed = true;
      } else {
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> DEPLOY BOAT`;
        btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        isDeployed = false;
      }
    }

    function playEmergencySiren() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    // Register Service Worker for 100% Offline PWA Mode
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Reg Error:', err));
    }
  </script>
</body>
</html>
